                  forecastStepSeconds:
                    description: Forecasting step size in seconds.
                    format: int32
                    type: integer
                  nextReactivePressureBump:
                    description: Reactive pressure level chosen by this reconcile.
                    format: int32
                    type: integer
                  observedAt:
                    description: Time when the pod reconciler completed this snapshot.
                    format: date-time
                    type: string
                  peakCpuSecondsPerMinute:
                    description: Peak CPU forecast used for replica math.
                    type: number
                  peakRequestsPerMinute:
                    description: Peak request forecast used for replica math.
                    type: number
                  proposedReplicas:
                    description: Proposed replica count before scale-down guardrails
