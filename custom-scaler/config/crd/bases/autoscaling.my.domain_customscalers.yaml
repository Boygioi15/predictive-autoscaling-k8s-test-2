                    format: int32
                    type: integer
                  requestReplicaDemand:
                    description: Replica demand derived from requests.
                    format: int32
                    type: integer
                  scaleDownAllowed:
                    description: Whether the scale-down guardrail allowed a pending
                      scale-down decision.
                    type: boolean
                  scaleDownReason:
                    description: Human-readable reason for the latest scale-down decision.
                    type: string
                  targetDeployment:
                    description: Deployment the pod reconciler evaluated.
                    type: string
                type: object
              reactivePressureBump:
                description: Stateful reactive pressure level used to accumulate emergency
                  scaling under sustained saturation.
                format: int32
                type: integer
              reactivePressureReason:
                description: Human-readable reason for the latest reactive pressure
                  bump transition.
                type: string
              workerPrototype:
                description: Durable worker-planning state for the prototype node
                  scaler.
                properties:
                  activeOperation:
                    description: |-
                      Legacy single-operation mirror kept for backwards-compatible status transitions.
                      New logic should use ActiveOperations.
                    properties:
                      commandFinishedAt:
                        description: When the executor observed the command job complete.
                        format: date-time
                        type: string
                      jobName:
                        description: Name of the Kubernetes Job executing the operation.
                        type: string
                      jobNamespace:
                        description: Namespace of the Kubernetes Job executing the
                          operation.
                        type: string
                      message:
                        description: Last executor message for humans.
                        type: string
                      operationType:
                        description: 'Type of worker operation: create or delete.'
                        type: string
                      phase:
                        description: 'Current executor phase: Running or WaitingForObservation.'
                        type: string
                      requestedCount:
                        description: Number of workers requested by this operation.
                          The prototype uses 1.
                        format: int32
                        type: integer
                      startedAt:
                        description: When the executor started the operation.
                        format: date-time
                        type: string
                      targetNodeName:
                        description: |-
                          Concrete node name passed to the executor. For create, this is the planned new node name.
                          For delete, this is the node selected for eviction and teardown.
                        type: string
                    type: object
                  activeOperations:
                    description: In-flight worker operations managed by the prototype
                      executor.
                    items:
                      properties:
                        commandFinishedAt:
                          description: When the executor observed the command job
                            complete.
                          format: date-time
                          type: string
                        jobName:
                          description: Name of the Kubernetes Job executing the operation.
                          type: string
                        jobNamespace:
                          description: Namespace of the Kubernetes Job executing the
                            operation.
                          type: string
                        message:
                          description: Last executor message for humans.
                          type: string
                        operationType:
                          description: 'Type of worker operation: create or delete.'
                          type: string
                        phase:
                          description: 'Current executor phase: Running or WaitingForObservation.'
                          type: string
                        requestedCount:
                          description: Number of workers requested by this operation.
                            The prototype uses 1.
                          format: int32
                          type: integer
                        startedAt:
                          description: When the executor started the operation.
                          format: date-time
                          type: string
                        targetNodeName:
                          description: |-
                            Concrete node name passed to the executor. For create, this is the planned new node name.
                            For delete, this is the node selected for eviction and teardown.
                          type: string
                      type: object
                    type: array
                  effectiveWorkerCount:
                    description: Effective worker count used by ensure_worker = ready
                      + pendingCreate - pendingDelete.
                    format: int32
                    type: integer
                  lastAction:
                    description: 'Last prototype action taken: enqueue-create, enqueue-delete,
                      or stable.'
                    type: string
                  lastEnsureTime:
                    description: Last time the prototype worker planner ran.
                    format: date-time
                    type: string
                  lastReason:
                    description: Human-readable explanation for the last prototype
                      action.
                    type: string
                  observedReadyWorkerCount:
                    description: Latest observed count of Ready worker nodes.
                    format: int32
                    type: integer
                  pendingCreateCount:
                    description: Number of worker creations that have been planned
                      but not yet observed as Ready.
                    format: int32
                    type: integer
                  pendingDeleteCount:
                    description: Number of worker deletions that have been planned
                      but not yet observed as gone.
                    format: int32
                    type: integer
                  targetWorkerCount:
                    description: Latest desired worker count requested by the prototype.
                    format: int32
                    type: integer
                type: object
            required:
            - currentReplicas
            - lastDesiredReplicas
            - lastEffectiveRequestsPerMinute
            - lastForecastPeak
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
