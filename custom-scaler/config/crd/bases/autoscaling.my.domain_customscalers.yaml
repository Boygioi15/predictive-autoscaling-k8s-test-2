---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: customscalers.autoscaling.my.domain
spec:
  group: autoscaling.my.domain
  names:
    kind: CustomScaler
    listKind: CustomScalerList
    plural: customscalers
    singular: customscaler
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: CustomScaler is the Schema for the customscalers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CustomScaler
            properties:
              deploymentName:
                description: Name of the Deployment to scale
                type: string
              forecastDeployment:
                description: |-
                  Optional deployment key sent to the forecasting service.
                  When omitted, the controller derives it from DeploymentName.
                type: string
              intervalMinutes:
                description: Polling interval in minutes. Defaults to 1 minute when
                  omitted or invalid.
                type: integer
              maxReplicas:
                description: Optional per-scaler override for the maximum replica
                  clamp.
                format: int32
                type: integer
              minReplicas:
                description: Optional per-scaler override for the minimum replica
                  clamp.
                format: int32
                type: integer
              requestsPerPod:
                description: Optional per-scaler override for the safe per-pod request
                  capacity per minute.
                type: number
              safetyFactor:
                description: Optional per-scaler override for the forecast safety
                  factor.
                type: number
              sparePod:
                description: Optional per-scaler override for the number of spare
                  pods to add.
                format: int32
                type: integer
              url:
                description: The forecasting service endpoint to call.
                type: string
              workerPrototype:
                description: Optional prototype settings for durable worker-count
                  planning.
                properties:
                  maxBatchSize:
                    description: Maximum number of worker operations to enqueue in
                      a single reconcile.
                    format: int32
                    type: integer
                  nodeLabelKey:
                    description: Optional node label key used to identify worker nodes.
                    type: string
                  nodeLabelValue:
                    description: Optional node label value used together with NodeLabelKey.
                    type: string
                  targetWorkerCount:
                    description: |-
                      Optional manual override for the desired worker-node count.
                      When omitted, the controller computes it from desired replicas, safety pods,
                      unschedulable pods, node allocatable CPU, and app pod request CPU.
                    format: int32
                    type: integer
                type: object
            required:
            - deploymentName
            - url
            type: object
          status:
            description: status defines the observed state of CustomScaler
            properties:
              currentReplicas:
                description: Current replica count
                format: int32
                type: integer
              lastDesiredReplicas:
                description: The latest desired replica count computed by the operator.
                format: int32
                type: integer
              lastEffectiveRequestsPerMinute:
                description: The latest buffered request volume per minute after applying
                  operator safety logic.
                type: number
              lastForecastPeak:
                description: The latest forecast peak seen from the forecasting service.
                type: number
              lastNodeLoop:
                description: Latest detailed node-scaling reconcile snapshot for UI/debugging.
                properties:
                  activeOperations:
                    description: Active worker operations after executor reconciliation.
                    items:
                      properties:
                        commandFinishedAt:
                          description: When the executor observed the command job
                            complete.
                          format: date-time
                          type: string
                        jobName:
                          description: Name of the Kubernetes Job executing the operation.
                          type: string
                        jobNamespace:
                          description: Namespace of the Kubernetes Job executing the
                            operation.
                          type: string
                        message:
                          description: Last executor message for humans.
                          type: string
                        operationType:
                          description: 'Type of worker operation: create or delete.'
                          type: string
                        phase:
                          description: 'Current executor phase: Running or WaitingForObservation.'
                          type: string
                        requestedCount:
                          description: Number of workers requested by this operation.
                            The prototype uses 1.
                          format: int32
                          type: integer
                        startedAt:
                          description: When the executor started the operation.
                          format: date-time
                          type: string
                        targetNodeName:
                          description: |-
                            Concrete node name passed to the executor. For create, this is the planned new node name.
                            For delete, this is the node selected for eviction and teardown.
                          type: string
                      type: object
                    type: array
                  currentAppScheduledPods:
                    description: App pods already scheduled on managed workers.
                    format: int32
                    type: integer
                  desiredPodsForCapacity:
                    description: Pod count the worker planner tried to provide capacity
                      for.
                    format: int32
                    type: integer
                  desiredReplicas:
                    description: Desired pod replicas observed by node scaling.
                    format: int32
                    type: integer
                  effectiveWorkers:
                    description: Effective worker count after pending create/delete
                      adjustments.
                    format: int32
                    type: integer
                  lastAction:
                    description: Latest planner action label.
                    type: string
                  lastReason:
                    description: Human-readable explanation for the latest planner
                      action.
                    type: string
                  maxWorkerCount:
                    description: Maximum worker count allowed by policy.
                    format: int32
                    type: integer
                  minWorkerCount:
                    description: Minimum worker count allowed by policy.
                    format: int32
                    type: integer
                  missingAppSlots:
                    description: App slots still missing after using all ready workers.
                    format: int32
                    type: integer
                  nodeAllocatableMilliCpu:
                    description: Allocatable CPU assumed for each worker node.
                    format: int32
                    type: integer
                  observedAt:
                    description: Time when the node reconciler completed this snapshot.
                    format: date-time
                    type: string
                  observedReadyWorkers:
                    description: Ready workers observed by ensure_worker state tracking.
                    format: int32
                    type: integer
                  pendingCreateWorkers:
                    description: Pending worker create operations tracked in status.
                    format: int32
                    type: integer
                  pendingDeleteWorkers:
                    description: Pending worker delete operations tracked in status.
                    format: int32
                    type: integer
                  podRequestMilliCpu:
                    description: Requested CPU assumed for each workload pod.
                    format: int32
                    type: integer
                  podsPerWorker:
                    description: Number of workload pods each worker can host.
                    format: int32
                    type: integer
                  rawTargetWorkerCount:
                    description: Raw worker target before min/max bounds are applied.
                    format: int32
                    type: integer
                  readyWorkerCount:
                    description: Ready workers counted during target computation.
                    format: int32
                    type: integer
                  requiredReadyWorkers:
                    description: Ready workers required to satisfy current slot demand.
                    format: int32
                    type: integer
                  safetyPods:
                    description: Extra safety pods reserved by worker capacity policy.
                    format: int32
                    type: integer
                  targetDeployment:
                    description: Deployment whose desired replica count fed node planning.
                    type: string
                  targetWorkerCount:
                    description: Final worker target after bounds are applied.
                    format: int32
                    type: integer
                  totalAppSlotCapacity:
                    description: Total app slot capacity observed on ready workers.
                    format: int32
                    type: integer
                  unschedulablePods:
                    description: Unschedulable workload pods observed during planning.
                    format: int32
                    type: integer
                  workerCapacityStrategy:
                    description: Worker-capacity strategy used for target computation.
                    type: string
                  workerTargetMode:
                    description: Whether worker planning used a manual or automatic
                      target.
                    type: string
                  workersToCreate:
                    description: Worker creations enqueued by this reconcile.
                    format: int32
                    type: integer
                  workersToDelete:
                    description: Worker deletions enqueued by this reconcile.
                    format: int32
                    type: integer
                type: object
              lastPodLoop:
                description: Latest detailed pod-scaling reconcile snapshot for UI/debugging.
                properties:
                  appliedScale:
                    description: Whether this reconcile updated the Deployment replica
                      count.
                    type: boolean
                  baseReplicaDemand:
                    description: Forecast-only replica demand before spare/reactive
                      adjustments.
                    format: int32
                    type: integer
                  cpuReplicaDemand:
                    description: Replica demand derived from CPU.
                    format: int32
                    type: integer
                  currentReactivePressureBump:
                    description: Reactive pressure level before this reconcile.
                    format: int32
                    type: integer
                  currentReplicas:
                    description: Replica count observed on the workload before this
                      reconcile applied changes.
                    format: int32
                    type: integer
                  desiredReplicas:
                    description: Final desired replica count after all guardrails.
                    format: int32
                    type: integer
                  dominantSignal:
                    description: Signal that dominated the base replica demand.
                    type: string
                  effectiveCpuSecondsPerMinute:
                    description: Safety-adjusted CPU forecast used for replica math.
                    type: number
                  effectiveRequestsPerMinute:
                    description: Safety-adjusted request forecast used for replica
                      math.
                    type: number
                  forecastBufferedHistoryRows:
                    description: Buffered context rows reported by the remote model.
                    format: int32
                    type: integer
                  forecastContractId:
                    description: Forecast contract id sent to the forecasting service.
                    type: string
                  forecastFeatureMetrics:
                    description: Feature metrics included in the selected forecast
                      contract.
                    items:
                      type: string
                    type: array
                  forecastGeneratedAt:
                    description: Timestamp string returned by the forecasting service
                      for this forecast batch.
                    type: string
                  forecastModelName:
                    description: Forecast model name returned by the forecasting service.
                    type: string
                  forecastModelVersion:
                    description: Forecast model version returned by the forecasting
